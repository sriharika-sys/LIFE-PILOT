<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <title>Offline — LifePilot</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f1f5f9;
        }
        .card {
          background: #0f172a;
          border-color: #1e293b;
        }
        .muted {
          color: #94a3b8;
        }
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #0d9488;
        color: #ffffff;
        font-weight: 700;
        font-size: 22px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.55;
      }
      .muted {
        color: #475569;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #0d9488;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        padding: 11px 20px;
        cursor: pointer;
      }
      button:hover {
        background: #0f766e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">LP</div>
      <h1>You are currently offline</h1>
      <p class="muted">
        LifePilot could not reach the server to load an uncached route. Your tasks, habits, goals, notes, and calendar data remain safely stored locally in this browser.
      </p>
      <button type="button" onclick="window.location.reload()">Try Reconnecting</button>
    </main>
  </body>
</html>
